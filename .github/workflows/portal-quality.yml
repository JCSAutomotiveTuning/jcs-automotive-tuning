name: Portal quality and payment-security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: public-test-placeholder
      NEXT_PUBLIC_SITE_URL: https://example.invalid
      SUPABASE_SERVICE_ROLE_KEY: private-test-placeholder
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Install from lockfile
        run: npm ci
      - name: Static lint
        run: npm run lint
      - name: Test (mocked, no payments)
        run: npm test
      - name: Scanner JavaScript syntax checks
        run: |
          node --check scripts/scan-worker.mjs
          node --check scripts/scan-pending-files.mjs
      - name: Production build
        run: npm run build
      - name: TypeScript verification
        run: npm run typecheck
